name: tappin
description: "One-tap location recorder for drives."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  model:
    path: lib/domain/model
  usecase:
    path: lib/domain/usecase
  flutter_haptic_gateway:
    path: lib/gateway/flutter_haptic_gateway
  system_clock_gateway:
    path: lib/gateway/system_clock_gateway
  wakelock_screen_awake_gateway:
    path: lib/gateway/wakelock_screen_awake_gateway
  url_launcher_external_map_gateway:
    path: lib/gateway/url_launcher_external_map_gateway
  native_geocoding_service:
    path: lib/gateway/native_geocoding_service
  geolocator_location_service:
    path: lib/gateway/geolocator_location_service
  shared_preferences_onboarding_gateway:
    path: lib/gateway/shared_preferences_onboarding_gateway
  native_overlay_service:
    path: lib/gateway/native_overlay_service
  method_channel_storage:
    path: lib/gateway/method_channel_storage

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.0
  hooks_riverpod: ^3.2.0
  flutter_hooks: ^0.21.0
  sqflite: ^2.3.3
  path: ^1.9.0
  permission_handler: ^12.0.0+1
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.3.2
  flutter_map_tile_caching: ^10.0.0
  latlong2: ^0.9.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  package_rename: 1.10.1
  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - .env
