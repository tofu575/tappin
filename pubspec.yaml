name: tappin
description: "One-tap location recorder for places you find on the go."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  model:
    path: lib/domain/model
  usecase:
    path: lib/domain/usecase
  flutter_haptic_gateway:
    path: lib/gateway/flutter_haptic_gateway
  system_clock_gateway:
    path: lib/gateway/system_clock_gateway
  wakelock_screen_awake_gateway:
    path: lib/gateway/wakelock_screen_awake_gateway
  url_launcher_external_map_gateway:
    path: lib/gateway/url_launcher_external_map_gateway
  native_geocoding_service:
    path: lib/gateway/native_geocoding_service
  geolocator_location_service:
    path: lib/gateway/geolocator_location_service
  shared_preferences_onboarding_gateway:
    path: lib/gateway/shared_preferences_onboarding_gateway
  method_channel_storage:
    path: lib/gateway/method_channel_storage

  cupertino_icons: 1.0.9
  flutter_riverpod: 3.4.3
  hooks_riverpod: 3.4.3
  flutter_hooks: 0.21.3+1
  path: 1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  package_rename: 1.10.1
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
