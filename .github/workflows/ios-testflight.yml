name: iOS TestFlight

on:
  workflow_run:
    workflows: [Android checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-com-tofu575-glarea
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-testflight
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Skip superseded automatic releases
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_DEPLOY: ${{ github.event_name == 'workflow_run' }}
        run: |
          if [[ "$AUTO_DEPLOY" == true ]]; then
            latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [[ "$latest_sha" != "$TARGET_SHA" ]]; then
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
      - name: Validate Apple configuration and prepare signing
        if: steps.source.outputs.deploy == 'true'
        id: signing
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          TESTFLIGHT_BUILD_OFFSET: ${{ vars.TESTFLIGHT_BUILD_OFFSET }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: python3 scripts/prepare_testflight_release.py
      - name: Import signing identity into a temporary keychain
        if: steps.source.outputs.deploy == 'true'
        env:
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          keychain="$RUNNER_TEMP/testflight-release/signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/testflight-release/distribution.p12" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign \
            -T /usr/bin/security -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$RUNNER_TEMP/testflight-release/distribution.mobileprovision" "$profiles/$PROFILE_UUID.mobileprovision"
      - name: Read pinned Flutter version
        if: steps.source.outputs.deploy == 'true'
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        if: steps.source.outputs.deploy == 'true'
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - if: steps.source.outputs.deploy == 'true'
        run: flutter pub get --enforce-lockfile
      - name: Build signed IPA
        if: steps.source.outputs.deploy == 'true'
        env:
          BUILD_NUMBER: ${{ steps.signing.outputs.build_number }}
        run: >-
          flutter build ipa --release --build-number="$BUILD_NUMBER"
          --export-options-plist="$RUNNER_TEMP/testflight-release/ExportOptions.plist"
      - name: Upload to App Store Connect for TestFlight
        if: steps.source.outputs.deploy == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          shopt -s nullglob
          archives=("$GITHUB_WORKSPACE"/build/ios/ipa/*.ipa)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo 'Expected exactly one exported IPA.' >&2
            exit 1
          fi
          cd "$RUNNER_TEMP/testflight-release"
          xcrun altool --upload-app --type ios --file "${archives[0]}" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Remove Apple credentials
        if: always()
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          trap 'rm -rf -- "$RUNNER_TEMP/testflight-release"' EXIT
          keychain="$RUNNER_TEMP/testflight-release/signing.keychain-db"
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f -- "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
